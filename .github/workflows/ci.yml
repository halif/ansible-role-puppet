---
name: CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Run yamllint
        run: yamllint -c .config/yamllint.yml .

      - name: Run ansible-lint
        run: ansible-lint -c .config/ansible-lint.yml .

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Molecule
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          pip install molecule-plugins[docker]

      - name: Make role available to Ansible
        run: |
          mkdir -p ~/.ansible/roles
          ln -s "$GITHUB_WORKSPACE" ~/.ansible/roles/puppet

      - name: Molecule syntax
        run: molecule syntax

      - name: Molecule create
        run: molecule create

      - name: Molecule converge
        id: molecule_converge
        continue-on-error: true
        run: molecule converge

      - name: Show Puppet Server diagnostics
        if: steps.molecule_converge.outcome == 'failure'
        run: |
          echo "===== Docker containers ====="
          docker ps -a

          CONTAINER_ID=$(docker ps -aq --filter "name=puppet-server")

          if [ -z "$CONTAINER_ID" ]; then
            echo "puppet-server container not found"
            exit 1
          fi

          echo "===== systemctl status ====="
          docker exec "$CONTAINER_ID" \
            systemctl status puppetserver --no-pager || true

          echo "===== systemctl cat ====="
          docker exec "$CONTAINER_ID" \
            systemctl cat puppetserver || true

          echo "===== systemctl show ====="
          docker exec "$CONTAINER_ID" \
            systemctl show puppetserver \
            -p ExecStart \
            -p ExecStop \
            -p ExecReload \
            -p PIDFile \
            -p User \
            -p Group \
            -p Type \
            -p TimeoutStartUSec \
            -p TimeoutStopUSec \
            --no-pager || true

          echo "===== journalctl ====="
          docker exec "$CONTAINER_ID" \
            journalctl -u puppetserver.service \
            --no-pager \
            -n 100 || true

          echo "===== Puppet Server version ====="
          docker exec "$CONTAINER_ID" \
            /opt/puppetlabs/server/apps/puppetserver/bin/puppetserver --version || true

          echo "===== Puppet Server help ====="
          docker exec "$CONTAINER_ID" \
            /opt/puppetlabs/server/apps/puppetserver/bin/puppetserver --help || true

          echo "===== Puppet Server processes ====="
          docker exec "$CONTAINER_ID" \
            ps auxww | grep -E '[p]uppet|[j]ava' || true

          echo "===== Puppet Server files ====="
          docker exec "$CONTAINER_ID" \
            ls -la /etc/puppetlabs/puppet/ || true

          echo "===== Puppet Server logs ====="
          docker exec "$CONTAINER_ID" \
            sh -c 'find /var/log/puppetlabs -maxdepth 3 -type f -print -exec tail -n 100 {} \;' \
            || true

      - name: Molecule verify
        if: steps.molecule_converge.outcome == 'success'
        run: molecule verify

      - name: Molecule destroy
        if: always()
        run: molecule destroy

      - name: Fail Molecule job
        if: steps.molecule_converge.outcome == 'failure'
        run: exit 1
