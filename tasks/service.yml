---
- name: Ensure Puppet Server is enabled and running
  block:
    - name: Enable and start Puppet Server
      ansible.builtin.systemd:
        name: "{{ puppetserver_service_name }}"
        enabled: true
        state: started
        daemon_reload: true

  rescue:
    - name: Show Puppet Server systemd unit
      ansible.builtin.command:
        cmd: systemctl cat puppetserver
      register: puppetserver_unit
      changed_when: false
      failed_when: false

    - name: Show Puppet Server systemd status
      ansible.builtin.command:
        cmd: systemctl status puppetserver --no-pager
      register: puppetserver_status
      changed_when: false
      failed_when: false

    - name: Show Puppet Server journal
      ansible.builtin.command:
        cmd: journalctl -u puppetserver.service --no-pager -n 100
      register: puppetserver_journal
      changed_when: false
      failed_when: false

    - name: Show Puppet Server version
      ansible.builtin.command:
        cmd: /usr/bin/puppetserver --version
      register: puppetserver_version
      changed_when: false
      failed_when: false

    - name: Show Puppet Server help
      ansible.builtin.command:
        cmd: /usr/bin/puppetserver --help
      register: puppetserver_help
      changed_when: false
      failed_when: false

    - name: Print Puppet Server systemd unit
      ansible.builtin.debug:
        var: puppetserver_unit.stdout_lines

    - name: Print Puppet Server status
      ansible.builtin.debug:
        var: puppetserver_status.stdout_lines

    - name: Print Puppet Server journal
      ansible.builtin.debug:
        var: puppetserver_journal.stdout_lines

    - name: Print Puppet Server version
      ansible.builtin.debug:
        var: puppetserver_version.stdout_lines

    - name: Print Puppet Server help
      ansible.builtin.debug:
        var: puppetserver_help.stdout_lines

    - name: Fail because Puppet Server did not start
      ansible.builtin.fail:
        msg: "Puppet Server failed to start. See diagnostics above."
